# Configuration Apache pour Impala.
# Le routage lui-meme (proxy SPARQL, dereferencement, en-tetes CORS) est decrit
# dans le fichier .htaccess du depot : cette configuration se contente de charger
# les modules dont il a besoin, puis de l'inclure (voir Include en fin de fichier).

ServerRoot "/usr/local/apache2"
ServerName impala
Listen 8080

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
# Requis par le .htaccess
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule ssl_module modules/mod_ssl.so

# Conteneur non root : rien n'est ecrit sous ServerRoot
PidFile /tmp/httpd.pid
Mutex posixsem default

# Regle 11 : ne pas exposer la version d'Apache dans l'en-tete Server
ServerTokens Prod
ServerSignature Off

TypesConfig conf/mime.types
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /proc/self/fd/1 common

DocumentRoot "/usr/local/apache2/htdocs"
DirectoryIndex index.html

<Directory />
    AllowOverride None
    Require all denied
</Directory>

<Directory "/usr/local/apache2/htdocs">
    Options FollowSymLinks
    # Les regles de reecriture sont chargees en contexte serveur (Include plus bas),
    # pas par repertoire : aucun .htaccess n'est lu ici.
    AllowOverride None
    Require all granted
</Directory>

# Le .htaccess ne doit jamais etre servi
<FilesMatch "^\.ht">
    Require all denied
</FilesMatch>

# Regles 5 et 7 : RewriteRule [P] vers l'endpoint SPARQL en https
ProxyRequests Off
SSLProxyEngine On

<IfModule ssl_module>
    SSLRandomSeed startup builtin
    SSLRandomSeed connect builtin
</IfModule>

# Regles de reecriture d'Impala (le .htaccess du depot).
# Chargees en contexte serveur et non par repertoire : les motifs y sont ancres
# sur le chemin complet (^/sparql, ^/.*), ce qui n'a de sens qu'ici -- en .htaccess
# le chemin teste est relatif au repertoire et ces regles ne matcheraient jamais.
Include conf/impala-rewrite.conf
