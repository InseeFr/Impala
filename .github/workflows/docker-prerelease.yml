name: Release
on:
    release:
        types: [prereleased]
        branches:
            - migration_to_kube
        paths-ignore:
            - documentation/**
jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [22]
        steps:
            - uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: 'pnpm'

            - run: pnpm install
            - run: pnpm test --coverage --watch=false

            # Garde-fou avant publication : verifie sur l'image elle-meme que les
            # regles de reecriture de nginx se comportent comme attendu.
            - name: Test rewrite rules against the Docker image
              run: pnpm test:docker

    docker:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.tag_name }}
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  push: true
                  file: Dockerfile
                  tags: ghcr.io/inseefr/impala:${{ github.event.release.tag_name }}
