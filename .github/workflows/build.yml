name: Quality
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # Tous les lundis à 12h UTC
    - cron: '0 12 * * 1'
jobs:
  test-build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Titre de PR, install, lint, typecheck, knip, tests et build.
      - uses: InseeFr/rmes-githubactions-commons/.github/actions/quality-front@main
        with:
          node-version: '22'
          pnpm-version: '10'
          test-command: pnpm test --coverage --watch=false
      # Scan complet : diagnostics React + audit Socket.dev des dependances.
      # Bloque des le niveau "warning" (doctor.config.json).
      - name: React Doctor
        run: pnpm run react-doctor
      - uses: sonarsource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
