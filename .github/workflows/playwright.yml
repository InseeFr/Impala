name: Playwright Tests
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# Lecture seule pour les deux jobs : ils clonent, installent et testent.
permissions:
    contents: read

jobs:
    test:
        name: UI tests
        timeout-minutes: 60
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: InseeFr/rmes-githubactions-commons/.github/actions/playwright@main

    rewrite-rules:
        name: Rewrite rules
        timeout-minutes: 20
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            # Node et pnpm viennent du commons, comme pour les autres jobs : ce
            # depot n'epingle aucune version lui-meme.
            - uses: InseeFr/rmes-githubactions-commons/.github/actions/setup-front@main
            - name: Install dependencies
              run: pnpm install
            # Aucun navigateur n'est necessaire : la suite n'utilise que le client HTTP
            # de Playwright. Elle construit l'image Docker et la teste avec un faux
            # endpoint SPARQL (tests/docker/compose.yaml).
            - name: Run rewrite rules tests against the Docker image
              run: pnpm test:docker
              # La pile est conservee pour pouvoir recuperer les logs ci-dessous
              # en cas d'echec ; le runner est ephemere.
              env:
                  KEEP_STACK: 1
            - name: Container logs
              if: failure()
              run: docker compose -f tests/docker/compose.yaml logs
