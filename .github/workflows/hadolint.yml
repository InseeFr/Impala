name: Hadolint

# Analyse statique du Dockerfile, sur chaque PR et sur chaque push de main.
# Les erreurs de Dockerfile — tag flottant, paquets non epingles, execution en
# root, couches inutiles — ne se voient ni a la relecture ni au build : elles ne
# deviennent un probleme qu'au moment du CVE ou du build non reproductible.
#
# Seuil a `warning`, celui que recommande la regle. Dette mesuree le 2026-09-18,
# apres epinglage de l'image de base : nulle a ce niveau. Le seul constat restant
# est un `info` (DL3066, user-id non numerique) et c'est un faux positif —
# hadolint ne resout pas $NGINX_USER_ID, qui vaut 101.
#
# Pour accepter une exception plus tard : une entree justifiee dans `ignored:` de
# .hadolint.yaml, jamais un `continue-on-error` qui viderait le garde-fou de son
# sens.

on:
    pull_request:
    push:
        branches: [main]

jobs:
    hadolint:
        name: Lint du Dockerfile
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
            - uses: hadolint/hadolint-action@v3.1.0
              with:
                  dockerfile: Dockerfile
                  # A garder en phase avec .hadolint.yaml, que l'action n'utilise
                  # pas pour ce reglage : elle passe toujours son propre drapeau.
                  failure-threshold: warning
